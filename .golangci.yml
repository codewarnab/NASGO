version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 1

# Keep CI focused on regression-safe checks already compatible with this codebase.
# go vet runs as its own required job in the workflow.
linters:
  default: none
  enable:
    - ineffassign

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - nas-go

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
