experiment:
  name: container-smoke
  seed: 42
search:
  strategy: random
  max_evaluations: 1
  population_size: 1
  tournament_size: 1
  num_workers: 1
  search_space:
    num_nodes: 2
    num_input_nodes: 2
    edges_per_node: 1
    operations: [identity, conv_3x3, zero]
evaluator:
  type: trainer
  dataset: fake
  data_path: /app/data
  epochs: 1
  batch_size: 4
  channels: 2
  layers: 1
  learning_rate: 0.025
  use_gpu: false
  python_path: python
  script_path: /app/scripts/train.py
  timeout: 2m
storage:
  type: none
  save_history: false
logging:
  level: error
  format: text
